services:
  cvat_db:
    restart: no
    ports:
      - '127.0.0.1:5432:5432'

  cvat_server:
    restart: no
    build:
      context: .
      args:
        http_proxy:
        https_proxy:
        socks_proxy:
        CLAM_AV:
        CVAT_DEBUG_ENABLED:
        COVERAGE_PROCESS_START:
    environment:
      # Use this with CVAT_DEBUG_ENABLED to avoid server response timeouts
      CVAT_DEBUG_ENABLED: '${CVAT_DEBUG_ENABLED:-no}'
      CVAT_DEBUG_PORT: '9090'
      # If 'yes', wait for a debugger connection on startup
      CVAT_DEBUG_WAIT: '${CVAT_DEBUG_WAIT_CLIENT:-no}'
      COVERAGE_PROCESS_START:
    ports:
      - '127.0.0.1:9090:9090'

  cvat_worker_export:
    restart: no
    environment:
      # For debugging, make sure to set 1 process
      # Due to the supervisord specifics, the extra processes will fail and
      # after few attempts supervisord will give up restarting, leaving only 1 process
      # NUMPROCS: 1
      CVAT_DEBUG_ENABLED: '${CVAT_DEBUG_ENABLED:-no}'
      CVAT_DEBUG_PORT: '9092'
      COVERAGE_PROCESS_START:
    ports:
      - '9092:9092'

  cvat_worker_import:
    restart: no
    environment:
      # For debugging, make sure to set 1 process
      # Due to the supervisord specifics, the extra processes will fail and
      # after few attempts supervisord will give up restarting, leaving only 1 process
      # NUMPROCS: 1
      CVAT_DEBUG_ENABLED: '${CVAT_DEBUG_ENABLED:-no}'
      CVAT_DEBUG_PORT: '9093'
      COVERAGE_PROCESS_START:
    ports:
      - '127.0.0.1:9093:9093'

  cvat_worker_quality_reports:
    restart: no
    environment:
      # For debugging, make sure to set 1 process
      # Due to the supervisord specifics, the extra processes will fail and
      # after few attempts supervisord will give up restarting, leaving only 1 process
      # NUMPROCS: 1
      CVAT_DEBUG_ENABLED: '${CVAT_DEBUG_ENABLED:-no}'
      CVAT_DEBUG_PORT: '9094'
      COVERAGE_PROCESS_START:
    ports:
      - '127.0.0.1:9094:9094'

  cvat_worker_consensus:
    restart: no
    environment:
      # For debugging, make sure to set 1 process
      # Due to the supervisord specifics, the extra processes will fail and
      # after few attempts supervisord will give up restarting, leaving only 1 process
      # NUMPROCS: 1
      CVAT_DEBUG_ENABLED: '${CVAT_DEBUG_ENABLED:-no}'
      CVAT_DEBUG_PORT: '9096'
      COVERAGE_PROCESS_START:
    ports:
      - '127.0.0.1:9096:9096'

  cvat_worker_annotation:
    restart: no
    environment:
      # For debugging, make sure to set 1 process
      # Due to the supervisord specifics, the extra processes will fail and
      # after few attempts supervisord will give up restarting, leaving only 1 process
      # NUMPROCS: 1
      CVAT_DEBUG_ENABLED: '${CVAT_DEBUG_ENABLED:-no}'
      CVAT_DEBUG_PORT: '9091'
      COVERAGE_PROCESS_START:
    ports:
      - '127.0.0.1:9091:9091'

  cvat_ui:
    restart: no
    build:
      context: .
      dockerfile: Dockerfile.ui.dev
    volumes:
      - ./:/tmp/
      - /tmp/node_modules
      - /tmp/cvat-ui/node_modules
      - /tmp/cvat-canvas/node_modules
      - /tmp/cvat-canvas3d/node_modules
      - /tmp/cvat-core/node_modules
      - /tmp/cvat-data/node_modules
    environment:
      - NODE_ENV=development
      - API_URL=http://cvat_server:8080
      - CVAT_UI_HOST=0.0.0.0
    command: yarn run start:cvat-ui -- --env API_URL=http://cvat_server:8080 --host 0.0.0.0
    ports:
      - '3000:3000'
    networks:
      - cvat
    depends_on:
      - cvat_server
    labels:
      traefik.enable: 'true'
      traefik.http.services.cvat-ui.loadbalancer.server.port: '3000'
      traefik.http.routers.cvat-ui.rule: Host(`${CVAT_HOST:-localhost}`)
      traefik.http.routers.cvat-ui.entrypoints: web

  cvat_clickhouse:
    restart: no
    ports:
      - '127.0.0.1:8123:8123'

  cvat_opa:
    restart: no
    ports:
      - '127.0.0.1:8181:8181'

  cvat_redis_inmem:
    restart: no
    ports:
      - '127.0.0.1:6379:6379'

  cvat_redis_ondisk:
    restart: no
    ports:
      - '127.0.0.1:6666:6666'

  cvat_vector:
    restart: no
    ports:
      - '127.0.0.1:8282:80'

  cvat_worker_utils:
    restart: no

  cvat_worker_webhooks:
    restart: no

  cvat_worker_chunks:
    restart: no

  traefik:
    restart: no

  cvat_grafana:
    restart: no
